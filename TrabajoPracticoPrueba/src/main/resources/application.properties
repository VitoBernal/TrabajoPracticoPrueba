spring.application.name=TrabajoPracticoPrueba

# ===== Conexión a MySQL 8 =====
# Sirve igual con MySQL en Docker (puerto 3306 publicado) o instalado localmente.
# La base "eventos_db" se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/eventos_db?createDatabaseIfNotExist=true&serverTimezone=UTC
# Cambiar por tu usuario y contraseña de MySQL
spring.datasource.username=root
spring.datasource.password=root

# ===== JPA / Hibernate =====
# update: crea o actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que ejecuta Hibernate
spring.jpa.show-sql=true
